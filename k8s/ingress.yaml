apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saintgits-web
  namespace: saintgits
  annotations: { nginx.ingress.kubernetes.io/ssl-redirect: "true" }
spec:
  ingressClassName: nginx
  tls: [{ hosts: [saintgits.example.com], secretName: saintgits-tls }]
  rules:
    - host: saintgits.example.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: saintgits-web, port: { number: 80 } } } }] }
